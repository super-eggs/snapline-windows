name: Build and publish Windows release

on:
  push:
    tags: ['v*', 'release-check/v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate version tag
        shell: pwsh
        run: |
          $source = Get-Content src/AssemblyInfo.cs -Raw
          $version = [regex]::Match($source, 'AssemblyFileVersion\("(\d+\.\d+\.\d+)\.0"\)').Groups[1].Value
          $versionTag = $env:GITHUB_REF_NAME -creplace '^release-check/', ''
          if (!$version -or $versionTag -cne "v$version") { throw 'Tag must match AssemblyFileVersion (vMAJOR.MINOR.PATCH).' }
          "SNAPLINE_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Test
      - name: Build the OCR edition and its offline runtime
        shell: pwsh
        run: |
          ./build.ps1 -Ocr
          python -m pip install --disable-pip-version-check uv==0.11.26
          if ($LASTEXITCODE -ne 0) { throw 'Could not install uv for recognition component builds.' }
          $pythonScripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $env:PATH = "$pythonScripts;$env:PATH"
          ./build-recognition.ps1
      - name: Package both editions
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          $tools = Join-Path $env:RUNNER_TEMP 'inno'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe' -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          if ($hash -ne 'F3C42116542C4CC57263C5BA6C4FEABFC49FE771F2F98A79D2F7628B8762723B') { throw 'Inno Setup checksum mismatch.' }
          $process = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', ('/DIR="' + $tools + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }
          ./package.ps1 -ISCC (Join-Path $tools 'ISCC.exe') -OcrBuildDirectory 'artifacts/ocr-build'
      - name: Test installation and uninstallation of both editions
        shell: pwsh
        run: |
          ./installer/test-install.ps1
          ./installer/test-install.ps1 -Ocr
      - name: Preserve validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation
          path: artifacts/*.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:SNAPLINE_RELEASE_VERSION
          $assets = @(
            "artifacts/release/Snapline-Setup-$version-x64.exe",
            "artifacts/release/Snapline-Portable-$version-x64.zip",
            "artifacts/release/Snapline-OCR-Setup-$version-x64.exe",
            "artifacts/release/Snapline-OCR-Portable-$version-x64.zip",
            "artifacts/release/SHA256SUMS.txt"
          )
          $tag = $env:GITHUB_REF_NAME
          $rehearsal = $tag.StartsWith('release-check/', [StringComparison]::Ordinal)
          $visibility = if ($rehearsal) { '--draft' } else { '--latest' }
          gh release create $tag @assets --verify-tag --title "Snapline $tag" --notes-file .github/release-notes.md $visibility
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          if ($rehearsal) {
            $release = gh release view $tag --json tagName,isDraft,assets | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or !$release.isDraft -or $release.tagName -cne $tag) { throw 'Could not verify rehearsal draft.' }
            try {
              $expected = $assets | ForEach-Object { Split-Path -Leaf $_ }
              $uploaded = @($release.assets | Where-Object state -eq 'uploaded' | ForEach-Object name)
              if (Compare-Object $expected $uploaded) { throw 'Rehearsal release assets are incomplete.' }
              Write-Host "PASS draft received $($uploaded -join ', ')"
            } finally {
              gh release delete $tag --yes
              if ($LASTEXITCODE -ne 0) { throw 'Rehearsal draft cleanup failed.' }
            }
          }

  website:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/sync-website-releases.yml
    with:
      release_tag: ${{ github.ref_name }}
